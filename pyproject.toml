[project]
name = "vokal-analyse"
version = "0.1.0"
description = "Vocal sound analysis of full tracks: advice on recording and effects."
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
    "audio-separator[gpu]>=0.30",
    "torch>=2.3",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

# NVIDIA graphics card on Windows: CUDA build of PyTorch.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
